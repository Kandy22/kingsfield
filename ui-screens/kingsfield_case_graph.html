<style>
  :root {

    --card-bg: #161616;
    --border: #2a2a2a;
    --gold: #c9a84c;
    --gold-dim: rgba(201,168,76,0.15);
    --cream: #e8e0cc;
    --white: #f5f5f0;
    --mid: #888;
    --dim: #555;

    --party:   #4a9eff;
    --exhibit: #f97316;
    --authority: #a855f7;
    --statute:   #22d3ee;
    --pleading:  #c9a84c;
    --issue:     #ef4444;
    --hub:       #f5f5f0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--black);
    color: var(--cream);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── NAV ── */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--near-black);
    flex-shrink: 0;
    z-index: 20;
  }
  .nav-brand {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--white);
    text-transform: uppercase;
  }
  .nav-brand span { color: var(--gold); }
  .nav-links { display: flex; gap: 24px; }
  .nav-links a {
    color: var(--mid);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--gold); }
  .matter-badge {
    background: var(--gold-dim);
    border: 1px solid rgba(201,168,76,0.3);
    color: var(--gold);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 4px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 28px;
    border-bottom: 1px solid var(--border);
    background: #0e0e0e;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .toolbar-label {
    font-size: 11px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-right: 4px;
  }
  .filter-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--mid);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
  }
  .filter-btn .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .filter-btn.active {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.18);
    color: var(--white);
  }
  .filter-btn:hover { border-color: rgba(255,255,255,0.25); color: var(--white); }

  .toolbar-sep { width: 1px; height: 22px; background: var(--border); margin: 0 6px; }

  .action-btn {
    margin-left: auto;
    padding: 5px 14px;
    border-radius: 4px;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.18s;
  }
  .action-btn:hover { background: var(--gold-dim); }

  /* ── MAIN ── */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  #graph {
    flex: 1;
    cursor: grab;
  }
  #graph:active { cursor: grabbing; }

  /* ── SIDE PANEL ── */
  .side-panel {
    width: 0;
    overflow: hidden;
    background: var(--near-black);
    border-left: 1px solid var(--border);
    transition: width 0.25s ease;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }
  .side-panel.open { width: 300px; }
  .panel-inner { padding: 20px; min-width: 300px; }
  .panel-type {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .panel-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--white);
    margin-bottom: 12px;
    line-height: 1.3;
  }
  .panel-divider {
    height: 1px;
    background: var(--border);
    margin: 14px 0;
  }
  .panel-meta-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .panel-meta-key { color: var(--dim); }
  .panel-meta-val { color: var(--cream); font-weight: 500; }
  .panel-desc {
    font-size: 12px;
    color: var(--mid);
    line-height: 1.6;
    margin-top: 10px;
  }
  .panel-connections {
    margin-top: 16px;
  }
  .panel-conn-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 8px;
  }
  .conn-chip {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 3px;
    font-size: 11px;
    margin: 3px 3px 3px 0;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--mid);
    cursor: pointer;
  }
  .conn-chip:hover { border-color: var(--gold); color: var(--gold); }
  .panel-close {
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    color: var(--dim);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
  }
  .panel-close:hover { color: var(--white); }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 7px 28px;
    border-top: 1px solid var(--border);
    background: var(--near-black);
    font-size: 11px;
    color: var(--dim);
    flex-shrink: 0;
  }
  .status-item strong { color: var(--mid); font-weight: 600; }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #22c55e;
    display: inline-block;
    margin-right: 5px;
  }

  /* SVG styles injected via JS */
</style>

// ── COLORS ─────────────────────────────────────────────────────────────────────
const typeColors = {
  hub:       '#f5f5f0',
  party:     '#4a9eff',
  exhibit:   '#f97316',
  authority: '#a855f7',
  statute:   '#22d3ee',
  pleading:  '#c9a84c',
  issue:     '#ef4444',
};
const typeLabels = {
  hub: 'Matter Hub', party: 'Party / Person', exhibit: 'Exhibit',
  authority: 'Case Authority', statute: 'Statute / CACI', pleading: 'Pleading / Discovery',
  issue: 'Legal Issue',
};

let currentFilter = 'all';
let simulation;
let svgEl, linkGroup, nodeGroup, zoomBehavior;
let selectedNode = null;

// ── INIT ───────────────────────────────────────────────────────────────────────
function init() {
  const svg = d3.select('#graph');
  const container = document.getElementById('graph');
  const W = container.clientWidth, H = container.clientHeight;

  svgEl = svg;
  svg.attr('width', W).attr('height', H);

  // Glow filter
  const defs = svg.append('defs');
  ['party','exhibit','authority','statute','pleading','issue','hub'].forEach(t => {
    const f = defs.append('filter').attr('id', `glow-${t}`).attr('x','-40%').attr('y','-40%').attr('width','180%').attr('height','180%');
    f.append('feGaussianBlur').attr('stdDeviation', '3').attr('result','coloredBlur');
    const fm = f.append('feMerge');
    fm.append('feMergeNode').attr('in','coloredBlur');
    fm.append('feMergeNode').attr('in','SourceGraphic');
  });

  const g = svg.append('g').attr('id','mainGroup');

  zoomBehavior = d3.zoom().scaleExtent([0.2, 4]).on('zoom', (e) => {
    g.attr('transform', e.transform);
  });
  svg.call(zoomBehavior);

  linkGroup = g.append('g').attr('id','links');
  nodeGroup = g.append('g').attr('id','nodes');

  buildGraph(W, H);
  updateStats();
}

function buildGraph(W, H) {
  const visibleNodes = currentFilter === 'all'
    ? nodes
    : nodes.filter(n => n.type === currentFilter || n.type === 'hub');
  const visibleIds = new Set(visibleNodes.map(n => n.id));
  const visibleLinks = links.filter(l => visibleIds.has(l.source.id || l.source) && visibleIds.has(l.target.id || l.target));

  simulation = d3.forceSimulation(visibleNodes)
    .force('link', d3.forceLink(visibleLinks).id(d => d.id).distance(d => 90 / (d.weight || 1) + 60))
    .force('charge', d3.forceManyBody().strength(-260))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide().radius(d => d.size + 14));

  // Links
  const link = linkGroup.selectAll('line').data(visibleLinks)
    .join('line')
    .attr('stroke', '#2a2a2a')
    .attr('stroke-width', d => Math.sqrt(d.weight || 1))
    .attr('stroke-opacity', 0.7);

  // Nodes
  const node = nodeGroup.selectAll('g.node').data(visibleNodes, d => d.id)
    .join(
      enter => {
        const g = enter.append('g').attr('class','node').style('cursor','pointer');
        g.append('circle');
        g.append('text');
        return g;
      }
    );

  node.select('circle')
    .attr('r', d => d.size)
    .attr('fill', d => typeColors[d.type] + (d.type === 'hub' ? '' : '22'))
    .attr('stroke', d => typeColors[d.type])
    .attr('stroke-width', d => d.type === 'hub' ? 2.5 : 1.5)
    .style('filter', d => `url(#glow-${d.type})`);

  node.select('text')
    .text(d => d.label)
    .attr('text-anchor', 'middle')
    .attr('dy', d => d.size + 13)
    .attr('fill', d => d.type === 'hub' ? '#f5f5f0' : typeColors[d.type] + 'cc')
    .attr('font-size', d => d.type === 'hub' ? '11px' : '10px')
    .attr('font-family', 'Inter, -apple-system, sans-serif')
    .attr('font-weight', d => d.type === 'hub' ? '600' : '400');

  node.on('click', (event, d) => {
    event.stopPropagation();
    openPanel(d);
    // Highlight
    node.select('circle')
      .attr('stroke-width', n => n.id === d.id ? 3 : (n.type === 'hub' ? 2.5 : 1.5))
      .attr('fill', n => n.id === d.id ? typeColors[n.type] + '55' : typeColors[n.type] + '22');
  });

  node.call(d3.drag()
    .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on('end', (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
  );

  simulation.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  document.getElementById('statFiltered').textContent = visibleNodes.length;
}

// ── PANEL ──────────────────────────────────────────────────────────────────────
function openPanel(d) {
  selectedNode = d;
  document.getElementById('panelType').textContent = typeLabels[d.type] || d.type;
  document.getElementById('panelType').style.color = typeColors[d.type];
  document.getElementById('panelName').textContent = d.label;
  document.getElementById('panelDesc').textContent = d.desc || '';

  // Meta
  const metaEl = document.getElementById('panelMeta');
  metaEl.innerHTML = '';
  if (d.meta) {
    Object.entries(d.meta).forEach(([k, v]) => {
      metaEl.innerHTML += `<div class="panel-meta-row"><span class="panel-meta-key">${k}</span><span class="panel-meta-val">${v}</span></div>`;
    });
  }

  // Connected nodes
  const connectedIds = new Set();
  links.forEach(l => {
    const s = l.source.id || l.source, t = l.target.id || l.target;
    if (s === d.id) connectedIds.add(t);
    if (t === d.id) connectedIds.add(s);
  });
  const connected = nodes.filter(n => connectedIds.has(n.id));
  const connEl = document.getElementById('panelConnections');
  if (connected.length) {
    connEl.innerHTML = `<div class="panel-conn-label">Connected (${connected.length})</div>`;
    connected.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'conn-chip';
      chip.textContent = c.label;
      chip.style.borderColor = typeColors[c.type] + '55';
      chip.style.color = typeColors[c.type];
      chip.onclick = () => openPanel(c);
      connEl.appendChild(chip);
    });
  } else {
    connEl.innerHTML = '';
  }

  document.getElementById('sidePanel').classList.add('open');
}

function closePanel() {
  document.getElementById('sidePanel').classList.remove('open');
  selectedNode = null;
  nodeGroup.selectAll('circle')
    .attr('stroke-width', d => d.type === 'hub' ? 2.5 : 1.5)
    .attr('fill', d => typeColors[d.type] + (d.type === 'hub' ? '' : '22'));
}

// ── FILTER ─────────────────────────────────────────────────────────────────────
function setFilter(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  linkGroup.selectAll('*').remove();
  nodeGroup.selectAll('*').remove();
  if (simulation) simulation.stop();
  const container = document.getElementById('graph');
  buildGraph(container.clientWidth, container.clientHeight);
  updateStats();
}

function updateStats() {
  document.getElementById('statNodes').textContent = nodes.length;
  document.getElementById('statEdges').textContent = links.length;
}

function resetZoom() {
  svgEl.transition().duration(500).call(zoomBehavior.transform, d3.zoomIdentity.translate(0,0).scale(1));
}

function exportSVG() {
  const svgNode = document.getElementById('graph');
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(svgNode);
  const blob = new Blob([svgStr], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'case-intelligence-graph.svg';
  a.click();
}

window.addEventListener('load', init);
window.addEventListener('resize', () => {
  const container = document.getElementById('graph');
  svgEl.attr('width', container.clientWidth).attr('height', container.clientHeight);
});
document.getElementById('graph').addEventListener('click', closePanel);
</script>
